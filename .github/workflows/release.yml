name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-major-tag:
    name: Move major version tag
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Point vX at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not semver (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
          echo "Moved $major to $TAG" >> "$GITHUB_STEP_SUMMARY"
