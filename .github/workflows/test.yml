name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    name: Scenario tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: test
      - run: bash test/run.sh

  e2e-single-repo:
    name: E2E · single repo (npm / npx)
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.workspace }}/../e2e-single
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build fixture repo
        run: bash test/e2e-setup.sh single-repo "$REPO" npx "npm install --no-audit --no-fund" drizzle.config.ts

      - name: Up to date → passes
        uses: ./
        with:
          working-directory: ${{ env.REPO }}

      - name: Add a column without a migration
        run: |
          source test/lib.sh
          drift "$REPO/src/db/schema.ts"

      - name: Drift → fails
        id: drift
        uses: ./
        continue-on-error: true
        with:
          working-directory: ${{ env.REPO }}

      - name: Assert the drift was caught
        env:
          OUTCOME: ${{ steps.drift.outcome }}
          FAILED: ${{ steps.drift.outputs.failed-configs }}
        run: |
          test "$OUTCOME" = failure
          test "$FAILED" = drizzle.config.ts

  e2e-monorepo:
    name: E2E · pnpm monorepo (4 configs, 2 packages)
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.workspace }}/../e2e-monorepo
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build fixture repo
        run: |
          bash test/e2e-setup.sh monorepo "$REPO" "pnpm exec" "pnpm install --no-frozen-lockfile" \
            packages/db/drizzle.users.config.ts \
            packages/db/drizzle.billing.config.ts \
            packages/db/drizzle.analytics.config.ts \
            packages/api/drizzle.config.ts

      - name: Explicit list → passes
        uses: ./
        with:
          working-directory: ${{ env.REPO }}
          runner: pnpm exec
          configs: |
            packages/db/drizzle.users.config.ts
            packages/db/drizzle.billing.config.ts
            packages/db/drizzle.analytics.config.ts
            packages/api/drizzle.config.ts

      - name: Glob → passes
        uses: ./
        with:
          working-directory: ${{ env.REPO }}
          runner: pnpm exec
          configs: packages/**/drizzle*.config.ts

      - name: Add a column to the billing schema without a migration
        run: |
          source test/lib.sh
          drift "$REPO/packages/db/src/billing/schema.ts"

      - name: Drift in one of three configs → fails
        id: drift
        uses: ./
        continue-on-error: true
        with:
          working-directory: ${{ env.REPO }}
          runner: pnpm exec
          configs: packages/**/drizzle*.config.ts

      - name: Assert only the billing config failed
        env:
          OUTCOME: ${{ steps.drift.outcome }}
          FAILED: ${{ steps.drift.outputs.failed-configs }}
        run: |
          test "$OUTCOME" = failure
          test "$FAILED" = packages/db/drizzle.billing.config.ts

      - name: Single package via working-directory still passes
        uses: ./
        with:
          working-directory: ${{ env.REPO }}/packages/api
          runner: pnpm exec
