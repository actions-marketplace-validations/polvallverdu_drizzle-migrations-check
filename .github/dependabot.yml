version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # drizzle-kit / drizzle-orm used by the test suite. Bumping these is how we find out
  # early that a new drizzle-kit release changed its output or behavior.
  - package-ecosystem: npm
    directory: /test
    schedule:
      interval: weekly
    groups:
      drizzle:
        patterns: ["drizzle-*"]
    commit-message:
      prefix: test
